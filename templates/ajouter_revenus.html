<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter un revenu - Wandji Finance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            WANDJI <span>FINANCE</span>
        </div>

        <nav>
            <a href="/">Accueil</a>
            <a href="/ajouter-depense">Dépenses</a>
            <a href="/ajouter-revenu">Revenus</a>
        </nav>

    </header>

    <main class="container">

        <section class="welcome">

            <h1>Ajouter un revenu</h1>

            <p>Enregistrez une nouvelle source de revenu.</p>

        </section>

        <section class="form-card">

            <form method="POST"
                  action="{{ url_for('ajouter_revenu') }}">

                <div class="form-group">

                    <label for="montant">
                        Montant (FCFA)
                    </label>

                    <input
                        type="number"
                        id="montant"
                        name="montant"
                        placeholder="Ex : 50000"
                        required
                    >

                </div>

                <div class="form-group">

                    <label for="source">
                        Source du revenu
                    </label>

                    <select id="source" name="source" required>

                        <option value="">
                            Choisir une source
                        </option>

                        <option value="Salaire">
                            Salaire
                        </option>

                        <option value="Commerce">
                            Commerce
                        </option>

                        <option value="Cadeau">
                            Cadeau
                        </option>

                        <option value="Autre">
                            Autre
                        </option>

                    </select>

                </div>

                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Ex : Vente de t-shirts"
                        rows="4"
                    ></textarea>

                </div>

                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>

                <button type="submit">
                    Enregistrer le revenu
                </button>

            </form>

        </section>

    </main>

</body>

</html>
