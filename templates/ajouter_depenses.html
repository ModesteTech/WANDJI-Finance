<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ajouter une dépense - Wandji Finance</title>

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <header class="navbar">

        <div class="logo">
            WANDJI <span>FINANCE</span>
        </div>

        <nav>
            <a href="/">Accueil</a>
            <a href="/ajouter-revenu">+Revenus</a>
        </nav>

    </header>


    <main class="container">

        <section class="welcome">

            <h1>Ajouter une dépense</h1>

            <p>Enregistrez une nouvelle dépense.</p>

        </section>
        
       
        <section class="form-card">

             <form method="POST" action="{{ url_for('ajouter_depense') }}">

                <div class="form-group">

                    <label for="montant">
                        Montant (FCFA)
                    </label>

                    <input
                        type="number"
                        id="montant"
                        name="montant"
                        placeholder="Ex : 1500"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="categorie">
                        Catégorie
                    </label>

                    <select id="categorie" name="categorie" required>

                        <option value="">
                            Choisir une catégorie
                        </option>

                        <option value="Alimentation">
                            Alimentation
                        </option>

                        <option value="Transport">
                            Transport
                        </option>

                        <option value="Logement">
                            Logement
                        </option>

                        <option value="Internet">
                            Internet
                        </option>

                        <option value="Autre">
                            Autre
                        </option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Ex : Achat de pain"
                        rows="4"
                    ></textarea>

                </div>


                <div class="form-group">

                    <label for="date">
                        Date
                    </label>

                    <input
                        type="date"
                        id="date"
                        name="date"
                        required
                    >

                </div>


                <button type="submit">
                    Enregistrer la dépense
                </button>

            </form>

        </section>

    </main>
    
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>

</html>
