<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Modifier une dépense - Wandji Finance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="logo">
        WANDJI <span>FINANCE</span>
    </div>

    <nav>
        <a href="/">Accueil</a>
        <a href="/historique">Historique</a>
    </nav>

</header>


<main class="container">

    <section class="welcome">

        <h1>Modifier une dépense</h1>

        <p>Modifiez les informations de votre dépense.</p>

    </section>


    <section class="form-card">

        <form method="POST">

            <div class="form-group">

                <label for="montant">
                    Montant (FCFA)
                </label>

                <input
                    type="number"
                    id="montant"
                    name="montant"
                    value="{{ depense['montant'] }}"
                    required
                >

            </div>


            <div class="form-group">

                <label for="categorie">
                    Catégorie
                </label>

                <select
                    id="categorie"
                    name="categorie"
                    required
                >

                    <option value="Alimentation"
                        {% if depense['categorie'] == 'Alimentation' %}selected{% endif %}>
                        Alimentation
                    </option>

                    <option value="Transport"
                        {% if depense['categorie'] == 'Transport' %}selected{% endif %}>
                        Transport
                    </option>

                    <option value="Logement"
                        {% if depense['categorie'] == 'Logement' %}selected{% endif %}>
                        Logement
                    </option>

                    <option value="Internet"
                        {% if depense['categorie'] == 'Internet' %}selected{% endif %}>
                        Internet
                    </option>

                    <option value="Autre"
                        {% if depense['categorie'] == 'Autre' %}selected{% endif %}>
                        Autre
                    </option>

                </select>

            </div>


            <div class="form-group">

                <label for="description">
                    Description
                </label>

                <textarea
                    id="description"
                    name="description"
                    rows="4"
                >{{ depense['description'] }}</textarea>

            </div>


            <div class="form-group">

                <label for="date">
                    Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    value="{{ depense['date'] }}"
                    required
                >

            </div>


            <button type="submit">
                Enregistrer les modifications
            </button>

        </form>

    </section>

</main>

</body>

</html>
