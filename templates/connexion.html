<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connexion - Wandji Finance</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<header class="navbar">

    <div class="logo">
        WANDJI <span>FINANCE</span>
    </div>

    <nav>
        <a href="/">Accueil</a>
    </nav>

</header>

<main class="container">

    <section class="welcome">
        <h1>Connexion</h1>
        <p>Connectez-vous à votre compte Wandji Finance.</p>
    </section>

    <section class="form-card">

        <form method="POST">

            <div class="form-group">

                <label for="email">
                    Adresse email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    required
                >

            </div>

            <div class="form-group">

                <label for="mot_de_passe">
                    Mot de passe
                </label>

                <input
                    type="password"
                    id="mot_de_passe"
                    name="mot_de_passe"
                    required
                >

                 <button
                    type="button"
                    class="toggle-password"
                    onclick="togglePassword('mot_de_passe')">
                    👁️
                </button>

            </div>

            <button type="submit">
                Se connecter
            </button>

        </form>

        <p class="connexion-link">
            Vous n'avez pas encore de compte ?
            <a href="/inscription">Créer un compte</a>
        </p>

    </section>

</main>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
